name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        id: loc
        run: |
          P=$(find . -name pubspec.yaml -not -path './.git/*' | head -1)
          if [ -z "$P" ]; then
            echo "pubspec.yaml not found. Repo contents:"
            find . -not -path './.git/*' -type f | head -50
            exit 1
          fi
          echo "dir=$(dirname "$P")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Generate android platform
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -r lib /tmp/lib
          flutter create . --platforms=android --org com.astro --project-name iss_sstv_tracker
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf lib && cp -r /tmp/lib lib
          rm -rf test

      - name: Patch android (permissions, desugaring, minSdk)
        working-directory: ${{ steps.loc.outputs.dir }}
        run: python3 tool/patch_android.py

      - name: Build
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: iss-sstv-tracker-apk
          path: ${{ steps.loc.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
